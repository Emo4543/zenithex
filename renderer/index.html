<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Zenithex</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="logo">ZENITH<span>//</span>EX</div>
    <div class="actions">
      <button id="btnExec" class="neon">▶ Execute</button>
      <button id="btnClear" class="pink">✖ Clear</button>
      <button id="btnOpen">📂 Open File</button>
      <button id="btnSave">💾 Save File</button>
      <button id="btnTab" class="neon">＋ Tab</button>
    </div>
    <div id="status" class="status off">Studio: bağlı değil</div>
  </header>
  <main>
    <section class="left">
      <div id="tabs"></div>
      <div class="editor">
        <pre id="hl" aria-hidden="true"></pre>
        <textarea id="code" spellcheck="false" placeholder="-- Luau kodunu buraya yaz"></textarea>
      </div>
      <div id="out"></div>
    </section>
    <aside>
      <div class="hubtitle">SCRIPT HUB</div>
      <div id="hub"></div>
    </aside>
  </main>
  <script src="hub.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
